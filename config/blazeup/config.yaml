# SA domain configuration
tc_prefix: "SA"

# Backend services to health-check / swagger-drift-monitor even when no API client
# references them yet. Single source of truth (read by runner health.py + swagger_check.py
# via utils.health_check.extra_services). Auto-discovered services are added on top.
services:
  - admin-api
  - compliance-api
  - connectors-api
  - helpplatform-api
  - sa-auth-api
  - sa-governance-api
  - sa-partners-api
  - sa-plans-api
  - sa-tenants-api
  - setting-api
  - workflow-api

# --- TC ID numbering (read by utils/sync_registry.py) -----------------------
# project_number  : the leading PROJECT digit in every TC ID for this domain.
# modules.<NAME>  : number  = the module's 2-digit slot,
#                   ui:/api: = feature->number maps (the section slot).
#   TC ID = {type}{project_number}{module.number:02d}{section:02d}{seq:02d}
#   type 1=UI / 0=API.  The project digit keeps IDs unique across projects
#   even when two domains reuse the same module name (e.g. "PARTNERS").
project_number: 2

modules:
  # Shell = cross-page / global features (page loads, load time).
  SHELL:
    number: 1
    ui:
      LOAD_TIME_PAGE: 1
      PAGE_LOADS: 2
  # SA Dashboard nav pages — each page is its own module, per the convention
  # PAGE_UI_FEATURE_NNN (e.g. DASHBOARD_UI_VISIBLE_001). Feature "VISIBLE" = the
  # page's key widgets render; add more features per page as you build them.
  DASHBOARD:
    number: 2
    ui: {VISIBLE: 1}
  # Pages below only reserve their module `number` (ID slot + inventory).
  # No test yet → no section declared. Add a `ui:`/`api:` section the moment you
  # write a test for that page, e.g.  TENANTS:\n    number: 3\n    ui: {VISIBLE: 1}
  TENANTS:
    number: 3
  BILLING:
    number: 4
  PLANS:
    number: 5
  # PARTNER — SA-side partner management. This IS the SA Dashboard "Partners" area:
  # the management UI (SA Partner Module screens) + the sa-partners-api backend.
  # Matches the Partner Platform test plan prefix PARTNER_*. Partner-PORTAL features
  # (My Pipeline, partner dashboard, ...) belong to the blazeup_partner domain.
  PARTNER:
    number: 6        # reuses the old "PARTNERS" nav-page slot (same concept, merged)
    ui:
      # Partner-portal (stgpartners) UI sections. PARTNER_PORTAL_SHELL = the
      # nav/shell page-load smoke across the portal's primary pages.
      PARTNER_PORTAL_SHELL: 1
      MY_PIPELINE: 2   # Deals page (/deals, "Deal Pipeline"): pipeline view, filters, deal cards
      COMMISSIONS: 3   # Commissions page (/commissions): earnings/payout totals, ledger tabs
      DASHBOARD: 4     # Dashboard page (/dashboard): KPI cards, tier progress, pipeline snapshot
      PARTNER_TEAM: 6  # Directory page (/directory): partner org team members + Invite User
      # SA-side partner-management screens (stgsa SA Dashboard "Partners" area):
      # directory, application FSM, deal-approval/conflict queues, rate table, etc.
      SA_PARTNER_MODULE: 5
    api:
      # API grouped by backend FEATURE/resource (not by page):
      PARTNER_ACCOUNT_MANAGEMENT: 1
      DEAL_REGISTRATION_PIPELINE: 2
      COMMISSIONS_PAYOUTS: 3   # _002 (ledger list) + _006 (rate-table) buildable; the rest BLOCKED
      TERRITORIES: 4
      CERTIFICATIONS_SA: 5
      AUDIT_LOG: 6
      PARTNER_USERS: 7
      DASHBOARD_DATA: 8
      PARTNER_PORTAL: 9
      AUTH_ACCESS_CONTROL: 10
      DEAL_APPROVAL_QUEUE: 11
      PIPELINE_MANAGEMENT: 12
      SECURITY_COMPLIANCE: 13   # _001 (audit-trail: actor/action/reasoning/correlationId) buildable; _002/_003 BLOCKED
      # /v1/partner/directory/users* — the partner org managing its OWN team (PRD §4.10).
      # Same NAME as ui.PARTNER_TEAM (=6) on purpose: one feature, two layers. The numbers
      # differ because the ui: and api: maps were filled independently and renumbering one
      # would rewrite every TC id in it.
      # NOT "partner directory": that label belongs to ui.SA_PARTNER_MODULE, where an SA
      # operator browses partner ORGANISATIONS (PRD §5.1). The backend path says
      # `directory` but means this org's own member list.
      PARTNER_TEAM: 14
      # /v1/partner/portal/clients* — the partner's own post-close tenants ("My Clients",
      # PRD §4.6), served from `partner_tenant_attribution`. Name kept as the test plan
      # spells it: 8 of the 9 rows in this section ARE the client-health / MSP features
      # (health, tickets, consent, provisioning, handoff), which BE has not shipped — only
      # _001 (the list + detail read) exists. Renaming to PARTNER_CLIENTS would fit that one
      # row and mislead on the other eight. Decided 2026-09-21.
      CLIENT_HEALTH_MSP: 15
      # /v1/sa/partner-attributions* — the SA-wide tenant<->partner attribution ledger
      # (PRD §7.5). Name kept exactly as the test plan spells it; unlike section 15 there was
      # never an alternative on the table. A row is written only once a won deal's tenant is
      # provisioned, so automation can read and filter this ledger but cannot create a row.
      TENANT_PROVISIONING_ATTRIBUTION: 16
  MARKETPLACE:
    number: 7
  # SA-Dashboard "Audit Log" nav PAGE — distinct from PARTNER.api.AUDIT_LOG (=6),
  # which holds the sa-partners-api audit-log API TCs. Reserved slot, no test yet.
  SA_AUDIT_PAGE:
    number: 8
  CONNECTORS:
    number: 9
  PLATFORM_TEMPLATES:
    number: 10
  MARKETING_LIBRARY:
    number: 11
  EXPENSE_LIBRARY:
    number: 12
  HELP_PLATFORM:
    number: 13
  STATUTORY_REPORTS:
    number: 14
  COMPLIANCE:
    number: 15
  GOVERNANCE:
    number: 16

# Excel result reporting — read by utils/excel_reporter.py when --excel-report is on.
# The test-plan file path is hard-coded in the runner to
#   docs/<domain>/Partner_Platform_Test_Plan.xlsx.
# `sheets`: which tabs the reporter writes automation results into. Add a name
#   here (e.g. "Tenant") to cover a NEW sheet — no code change. Every listed
#   sheet must share the column layout below (1-based indices).
# Lookup key = column C (Test Case Name) matched against each test's TC name.
excel:
  sheets:
    - "Partner Platform"
  col_tc_string: 3       # C: Test Case Name (lookup key)
  col_auto_flag: 11      # K: Auto  ("YES")
  col_auto_status: 12    # L: Automation Status (PASSED / FAILED / BLOCKED / NOT_STARTED)
  data_start_row: 13     # first data row
  # Optional (sync title/priority lookup — inert unless BOTH `sheet` + `module` set):
  #   sheet: "Partner Platform"
  #   module: PARTNER
  #   excel_prefix: PARTNER_API
